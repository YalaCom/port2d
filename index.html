<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Причал — Port Reseller</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0c1218; height: 100%; width: 100%; font-family: "Press Start 2P", monospace; }
      #game-root { width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      #ui-root .panel, #ui-root button, #ui-root input { pointer-events: auto; }
      .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
      .chip { background: #3a2918ee; color: #f4e6c1; border: 3px solid #8b5a2b; padding: 8px 10px; font-size: 10px; line-height: 1.4; box-shadow: 0 3px 0 #1a1008; pointer-events: auto; }
      .hud-right { margin-left: auto; display: flex; gap: 8px; }
      .hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: #1a1008dd; color: #f4e6c1; border: 3px solid #c9a36a; padding: 10px 14px; font-size: 9px; max-width: min(640px, 92vw); text-align: center; line-height: 1.6; }
      .modal-back { position: absolute; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
      .modal { background: #2b1d10; color: #f4e6c1; border: 4px solid #c9a36a; width: min(720px, 94vw); max-height: 88vh; overflow: auto; padding: 16px; box-shadow: 0 8px 0 #1a1008; }
      .modal h2 { margin: 0 0 12px; font-size: 13px; color: #ffe7a3; }
      .modal p, .modal li { font-size: 9px; line-height: 1.7; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .goods { display: grid; gap: 8px; margin: 10px 0; }
      .good { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; background: #3e2a16; border: 2px solid #7a4e24; padding: 8px; }
      .ico { width: 24px; height: 24px; border: 1px solid #1a1008; }
      button.px { background: #6b3f18; color: #ffe7a3; border: 3px solid #c9a36a; font-family: inherit; font-size: 9px; padding: 8px 10px; cursor: pointer; }
      button.px:hover { background: #8a5420; }
      button.px.ghost { background: #2b1d10; }
      button.px.danger { background: #5a1d16; }
      input.px { background: #1a1008; color: #ffe7a3; border: 2px solid #c9a36a; font-family: inherit; font-size: 10px; padding: 6px; width: 80px; }
      .log { background: #1a1008; padding: 8px; min-height: 48px; font-size: 8px; line-height: 1.6; }
      .toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: #1a1008; color: #ffe7a3; border: 3px solid #c9a36a; padding: 8px 12px; font-size: 9px; pointer-events: none; }
      .interact-btn { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); }
      .enter-prompt { font-size: 8px; color: #9ad0a0; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
